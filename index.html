<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
    <title>Armario y conjuntos - Attire</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="phone-brand" aria-hidden="true" data-i18n="app.name"></div>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
      <button id="header-add" class="button primary header-add" type="button" data-i18n="wardrobe.add" hidden></button>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-action" class="button strong" type="button" hidden></button>
    </div>

    <main>
      <p id="sync-offline" class="sync-note" role="status" hidden><svg class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span data-i18n="sync.offline"></span></p>

      <section id="wardrobe" class="pane single">
        <div class="pane-list">
          <div id="garment-groups" class="garment-groups"></div>
          <div id="wardrobe-empty" class="empty-state" hidden>
            <p data-i18n="wardrobe.empty"></p>
            <button id="wardrobe-add" class="button primary" type="button" data-i18n="wardrobe.add"></button>
          </div>
          <div id="wardrobe-side" class="wardrobe-side">
            <aside id="random-panel" class="random-panel" aria-labelledby="random-title" hidden></aside>
          </div>
        </div>
        <article id="garment-detail" class="pane-detail garment-detail">
          <button id="garment-back" class="button quiet pane-back detail-back" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#back"/></svg><span data-i18n="nav.wardrobe"></span></button>
          <div id="garment-media" class="garment-detail-media"></div>
          <div id="garment-info" class="garment-detail-info"></div>
          <div id="garment-actions" class="cluster garment-detail-actions">
            <button id="garment-edit" class="button primary" type="button" data-i18n="action.edit"></button>
            <a id="garment-open" class="button outline" target="_blank" rel="noopener noreferrer" data-i18n="wardrobe.openLink" hidden></a>
            <button id="garment-delete" class="button quiet danger" type="button" data-i18n="action.delete"></button>
          </div>
          <div id="garment-outfits" class="outfits garment-detail-outfits"></div>
        </article>
      </section>

      <section id="fill" class="pane single" hidden>
        <div class="pane-list fill-page">
          <div id="fill-filter"></div>
          <p class="basics-panel-hint fill-hint" data-i18n="fill.hint"></p>
          <ul id="fill-list" class="basics-panel-list fill-list"></ul>
          <p id="fill-empty" class="empty-state inline" data-i18n="fill.empty" hidden></p>
        </div>
      </section>

      <section id="combinations" class="pane wide" hidden>
        <div class="pane-list">
          <select id="family" class="select family-pick" data-i18n-attr="aria-label:combinations.family"></select>
          <div id="combination-sizes" class="cluster scroll size-filter"></div>
          <label class="switch wearable-switch"><span data-i18n="combinations.wearable"></span><input id="combination-wearable" class="switch-input" type="checkbox" role="switch"></label>
          <ul id="combination-list" class="item-list combo-list"></ul>
          <div id="combinations-empty" class="empty-state" hidden>
            <p data-i18n="combinations.empty"></p>
            <button id="combinations-all" class="button primary" type="button" data-i18n="combinations.showAll"></button>
          </div>
        </div>
        <article id="combination-detail" class="pane-detail">
          <button id="combination-back" class="button quiet pane-back detail-back" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#back"/></svg><span data-i18n="action.back"></span></button>
          <p id="combination-detail-empty" class="empty-state inline" data-i18n="combinations.pick"></p>
          <div id="combination-info"></div>
          <div id="combination-outfits" class="outfits"></div>
        </article>
      </section>

      <section id="settings" class="settings" hidden>
        <div id="account-group" class="settings-section" hidden>
          <h2 class="list-group-head" data-i18n="settings.account"></h2>
          <p class="settings-hint" data-i18n="settings.accountHint"></p>
          <div class="list-group">
            <div id="account-row" class="settings-row account-row"><span id="account-email" class="settings-row-label"></span><span id="account-sync" class="settings-row-value"></span></div>
            <button id="logout" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.logout"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="account-login" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.signIn"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <div class="settings-section">
          <h2 class="list-group-head" data-i18n="settings.backup"></h2>
          <p class="settings-hint" data-i18n="settings.backupHint"></p>
          <div class="list-group">
            <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span id="export-count" class="settings-row-value"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="reset" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="settings.reset"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <div class="settings-section">
          <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
          <p class="settings-hint" data-i18n="settings.preferencesHint"></p>
          <div class="list-group">
            <div class="settings-row">
              <span class="settings-row-label" data-i18n="settings.language"></span>
              <span id="language-value" class="settings-row-value"></span>
              <span class="chevron" aria-hidden="true">›</span>
              <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
            </div>
            <div class="settings-row">
              <span class="settings-row-label" data-i18n="settings.theme"></span>
              <span id="theme-value" class="settings-row-value"></span>
              <span class="chevron" aria-hidden="true">›</span>
              <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <h2 class="list-group-head" data-i18n="settings.modules"></h2>
          <p class="settings-hint" data-i18n="settings.modulesHint"></p>
          <div class="list-group">
            <label class="switch"><span data-i18n="nav.combinations"></span><input class="switch-input" type="checkbox" role="switch" data-module="combinations"></label>
            <label class="switch"><span data-i18n="nav.fill"></span><input class="switch-input" type="checkbox" role="switch" data-module="fill"></label>
          </div>
        </div>
        <div class="settings-section">
          <h2 class="list-group-head" data-i18n="settings.families"></h2>
          <p class="settings-hint" data-i18n="settings.familiesHint"></p>
          <div class="list-group">
            <div class="settings-row">
              <span class="settings-row-label" data-i18n="settings.familyInUse"></span>
              <span id="family-in-use-value" class="settings-row-value"></span>
              <span class="chevron" aria-hidden="true">›</span>
              <select id="family-in-use" class="select" data-i18n-attr="aria-label:settings.familyInUse"></select>
            </div>
            <label class="switch"><span data-i18n="family.wada"></span><input class="switch-input" type="checkbox" role="switch" data-family="wada"></label>
            <label class="switch"><span data-i18n="family.complementary"></span><input class="switch-input" type="checkbox" role="switch" data-family="complementary"></label>
            <label class="switch"><span data-i18n="family.analogous"></span><input class="switch-input" type="checkbox" role="switch" data-family="analogous"></label>
            <label class="switch"><span data-i18n="family.triadic"></span><input class="switch-input" type="checkbox" role="switch" data-family="triadic"></label>
            <label class="switch"><span data-i18n="family.split"></span><input class="switch-input" type="checkbox" role="switch" data-family="split"></label>
            <label class="switch"><span data-i18n="family.accent"></span><input class="switch-input" type="checkbox" role="switch" data-family="accent"></label>
            <label class="switch"><span data-i18n="family.mono"></span><input class="switch-input" type="checkbox" role="switch" data-family="mono"></label>
          </div>
        </div>
        <div class="settings-section">
          <h2 class="list-group-head" data-i18n="settings.matching"></h2>
          <p class="settings-hint" data-i18n="settings.matchingHint"></p>
          <div class="list-group">
            <label class="switch"><span data-i18n="matching.neutrals"></span><input class="switch-input" type="checkbox" role="switch" data-matching="neutrals"></label>
            <div class="settings-row">
              <span class="settings-row-label" data-i18n="matching.contrast"></span>
              <span id="matching-contrast-value" class="settings-row-value"></span>
              <span class="chevron" aria-hidden="true">›</span>
              <select id="matching-contrast" class="select" data-i18n-attr="aria-label:matching.contrast"></select>
            </div>
            <div class="settings-row">
              <span class="settings-row-label" data-i18n="matching.colorType"></span>
              <span id="matching-colorType-value" class="settings-row-value"></span>
              <span class="chevron" aria-hidden="true">›</span>
              <select id="matching-colorType" class="select" data-i18n-attr="aria-label:matching.colorType"></select>
            </div>
            <label class="switch"><span data-i18n="matching.formality"></span><input class="switch-input" type="checkbox" role="switch" data-matching="formality"></label>
          </div>
        </div>
        <div id="install-group" class="settings-section" hidden>
          <h2 class="list-group-head" data-i18n="settings.app"></h2>
          <div class="list-group">
            <div class="settings-row"><button id="install" class="button primary" type="button" data-i18n="settings.install"></button></div>
          </div>
        </div>
        <div class="settings-section">
          <h2 class="list-group-head" data-i18n="settings.help"></h2>
          <div class="list-group">
            <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
          <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>


    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <div class="nav-brand" aria-hidden="true"><img src="./icons/icon-192.png" alt="" width="28" height="28"><span data-i18n="app.name"></span></div>
      <button class="nav-item" type="button" data-view="wardrobe">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#hanger"/></svg>
        <span data-i18n="nav.wardrobe"></span>
      </button>
      <button class="nav-item" type="button" data-view="fill">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg>
        <span data-i18n="nav.fill"></span>
      </button>
      <button class="nav-item" type="button" data-view="combinations">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#palette"/></svg>
        <span data-i18n="nav.combinations"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
      <p id="nav-account" class="nav-foot" data-i18n-attr="title:nav.local" hidden><svg class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span class="nav-foot-text" data-i18n="nav.local"></span></p>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="garment-sheet" class="sheet-layer" hidden>
      <div id="garment-veil" class="sheet-veil"></div>
      <form id="garment-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="garment-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="garment-sheet-title" class="sheet-title main"></h2><button id="garment-close" class="button tonal" type="button" data-i18n="action.close"></button></header>
        <div class="sheet-body garment-form">
          <label class="field"><input id="garment-name" class="input field-input" type="text" maxlength="60" required data-i18n-attr="placeholder:wardrobe.name"><span class="field-label" data-i18n="wardrobe.name"></span></label>
          <label class="field"><input id="garment-brand" class="input field-input" type="text" maxlength="40" role="combobox" aria-autocomplete="list" aria-controls="garment-brands" aria-expanded="false" data-i18n-attr="placeholder:wardrobe.brand"><span class="field-label" data-i18n="wardrobe.brand"></span></label>
          <ul id="garment-brands" class="list-group plain brand-suggestions" role="listbox" data-i18n-attr="aria-label:wardrobe.brand" hidden></ul>
          <label class="field"><input id="garment-reference" class="input field-input" type="text" maxlength="40" autocapitalize="off" spellcheck="false" data-i18n-attr="placeholder:wardrobe.reference"><span class="field-label" data-i18n="wardrobe.reference"></span></label>
          <select id="garment-slot" class="select" data-i18n-attr="aria-label:wardrobe.slot"></select>
          <select id="garment-season" class="select" data-i18n-attr="aria-label:wardrobe.season"></select>
          <select id="garment-formality" class="select" data-i18n-attr="aria-label:wardrobe.formality" hidden></select>
          <div class="color-pick">
            <input id="garment-color-input" class="color-pick-input" type="color" data-i18n-attr="aria-label:wardrobe.color">
            <span id="garment-color-name" class="color-pick-name"></span>
          </div>
          <label class="field"><input id="garment-color-text" class="input field-input" type="text" maxlength="40" autocapitalize="off" spellcheck="false" data-i18n-attr="placeholder:wardrobe.colorCode"><span class="field-label" data-i18n="wardrobe.colorCode"></span></label>
          <div id="garment-swatches" class="swatch-grid"></div>
          <label class="field"><input id="garment-link" class="input field-input" type="url" inputmode="url" data-i18n-attr="placeholder:wardrobe.link"><span class="field-label" data-i18n="wardrobe.link"></span></label>
          <button id="garment-load" class="button outline wide" type="button" data-i18n="wardrobe.loadImages" disabled></button>
          <div id="garment-images" class="image-grid" hidden></div>
          <div class="input-row">
            <input id="garment-image-url" class="input" type="url" inputmode="url" data-i18n-attr="placeholder:wardrobe.imageUrl,aria-label:wardrobe.imageUrl">
            <button id="garment-image-add" class="button outline" type="button" data-i18n="action.add"></button>
          </div>
          <h3 class="sheet-title part" data-i18n="wardrobe.purchase"></h3>
          <label class="field"><input id="garment-buy-date" class="input field-input" type="date" data-i18n-attr="placeholder:wardrobe.buyDate"><span class="field-label" data-i18n="wardrobe.buyDate"></span></label>
          <label class="field"><input id="garment-price" class="input field-input" type="text" inputmode="decimal" maxlength="12" data-i18n-attr="placeholder:wardrobe.priceEuros"><span class="field-label" data-i18n="wardrobe.priceEuros"></span></label>
          <h3 class="sheet-title part" data-i18n="wardrobe.sizing"></h3>
          <label class="field"><input id="garment-size" class="input field-input" type="text" maxlength="20" data-i18n-attr="placeholder:wardrobe.size"><span class="field-label" data-i18n="wardrobe.size"></span></label>
          <div id="garment-fit" class="segmented fit-pick" role="group" data-i18n-attr="aria-label:wardrobe.fit"></div>
          <div id="garment-measures" class="measure-lines"></div>
          <button id="garment-measure-add" class="button outline wide" type="button" data-i18n="wardrobe.addMeasure"></button>
          <datalist id="garment-measure-names"></datalist>
          <datalist id="garment-units"></datalist>
        </div>
        <footer class="sheet-foot"><button class="button primary wide" type="submit" data-i18n="action.save"></button></footer>
      </form>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <img class="onboarding-logo" src="./icons/logo.png" alt="">
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="welcome" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M104 40h32l14 14-10 8v50h-40V62l-10-8z"/>
            <circle class="art-solid" cx="170" cy="130" r="18"/>
            <path class="art-on-solid" d="M170 122v16M162 130h16"/>
          </svg>
          <svg data-page="outfits" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="24" y="28" width="56" height="76" rx="8"/>
            <rect class="art-card" x="92" y="28" width="56" height="76" rx="8"/>
            <rect class="art-card" x="160" y="28" width="56" height="76" rx="8"/>
            <circle class="art-solid" cx="52" cy="124" r="8"/>
            <circle class="art-soft" cx="120" cy="124" r="8"/>
            <circle class="art-accent" cx="188" cy="124" r="8"/>
          </svg>
          <svg data-page="palettes" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-soft" x="40" y="24" width="48" height="28" rx="6"/>
            <rect class="art-solid" x="96" y="24" width="48" height="28" rx="6"/>
            <rect class="art-card" x="152" y="24" width="48" height="28" rx="6"/>
            <rect class="art-card" x="70" y="68" width="100" height="72" rx="10"/>
            <path class="art-accent" d="M90 88h40M90 104h28"/>
            <circle class="art-solid" cx="170" cy="130" r="18"/>
            <path class="art-on-solid" d="M170 122v16M162 130h16"/>
          </svg>
          <svg data-page="offline" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="28" y="36" width="60" height="100" rx="10"/>
            <rect class="art-card" x="152" y="36" width="60" height="100" rx="10"/>
            <path class="art-accent" d="M44 60a20 20 0 0 1 28 0M50 70a11 11 0 0 1 16 0"/>
            <circle class="art-accent" cx="58" cy="80" r="3"/>
            <path class="art-accent" d="M168 60a20 20 0 0 1 28 0M174 70a11 11 0 0 1 16 0"/>
            <circle class="art-accent" cx="182" cy="80" r="3"/>
            <path class="art-accent" d="M100 72h40l-8-8M140 100h-40l8 8"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title" class="onboarding-title"></h2>
          <p id="onboarding-text" class="onboarding-text"></p>
        </div>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" class="button outline quiet" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="button primary" type="button"></button>
      </div>
    </div>

    <section id="auth" class="account" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
      <div id="login" class="account-page">
        <img class="account-logo" src="./icons/logo.png" alt="">
        <h2 id="login-title" class="account-title" tabindex="-1" data-i18n="account.login.title"></h2>
        <p class="account-text" data-i18n="account.login.text"></p>
        <button id="login-google" class="button tonal wide" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#google"/></svg><span data-i18n="account.google"></span></button>
        <p id="login-error" class="input-help danger" role="alert" hidden></p>
        <button id="login-offline" class="button accent" type="button" data-i18n="account.offline"></button>
      </div>
      <div id="waiting" class="account-page" hidden>
        <svg class="icon account-wait" aria-hidden="true"><use href="icons.svg#refresh"/></svg>
        <h2 id="waiting-title" class="account-title" tabindex="-1" data-i18n="account.waiting.title"></h2>
        <p class="account-text" data-i18n="account.waiting.text"></p>
        <button id="waiting-check" class="button tonal wide" type="button" data-i18n="account.waiting.check"></button>
        <button id="waiting-logout" class="button accent" type="button" data-i18n="account.logout"></button>
      </div>
    </section>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#ds/sheet": "./vendor/design-system/sheet.js",
          "#config": "./src/config.js",
          "#pocketbase": "./src/pocketbase.js",
          "#session": "./src/session.js",
          "#wada": "./src/wada.js",
          "#palette": "./src/palette.js",
          "#garments": "./src/garments.js",
          "#records": "./src/records.js",
          "#sync": "./src/sync.js",
          "#syncer": "./src/syncer.js",
          "#brands": "./src/brands.js",
