<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
    <title>Armario y conjuntos - Attire</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-action" class="button strong" type="button" hidden></button>
    </div>

    <main>
      <section id="wardrobe" class="pane">
        <div class="pane-list">
          <ul id="garment-list" class="item-list"></ul>
          <div id="wardrobe-empty" class="empty-state" hidden>
            <p data-i18n="wardrobe.empty"></p>
            <button id="wardrobe-add" class="button primary" type="button" data-i18n="wardrobe.add"></button>
          </div>
        </div>
        <article id="garment-detail" class="pane-detail">
          <button id="garment-back" class="button quiet pane-back" type="button" data-i18n="action.back"></button>
          <p id="garment-detail-empty" class="empty-state inline" data-i18n="wardrobe.pick"></p>
          <div id="garment-info" class="detail-head"></div>
          <div id="garment-actions" class="cluster">
            <button id="garment-edit" class="button outline" type="button" data-i18n="action.edit"></button>
            <a id="garment-open" class="button outline" target="_blank" rel="noopener noreferrer" data-i18n="wardrobe.openLink" hidden></a>
            <button id="garment-delete" class="button danger" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="action.delete"></span></button>
          </div>
          <div id="garment-outfits" class="outfits"></div>
        </article>
      </section>

      <section id="combinations" class="pane" hidden>
        <div class="pane-list">
          <div id="combination-sizes" class="cluster scroll size-filter"></div>
          <div class="list-group">
            <label class="switch"><span data-i18n="combinations.wearable"></span><input id="combination-wearable" class="switch-input" type="checkbox" role="switch"></label>
          </div>
          <ul id="combination-list" class="item-list"></ul>
          <div id="combinations-empty" class="empty-state" hidden>
            <p data-i18n="combinations.empty"></p>
            <button id="combinations-all" class="button primary" type="button" data-i18n="combinations.showAll"></button>
          </div>
        </div>
        <article id="combination-detail" class="pane-detail">
          <button id="combination-back" class="button quiet pane-back" type="button" data-i18n="action.back"></button>
          <p id="combination-detail-empty" class="empty-state inline" data-i18n="combinations.pick"></p>
          <div id="combination-info" class="detail-head"></div>
          <div id="combination-outfits" class="outfits"></div>
        </article>
      </section>

      <section id="settings" class="settings" hidden>
        <h2 class="list-group-head" data-i18n="settings.backup"></h2>
        <div class="list-group">
          <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
        <div class="list-group">
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.language"></span>
            <span id="language-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.hand"></span>
            <span id="hand-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.theme"></span>
            <span id="theme-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.modules"></h2>
        <div class="list-group">
          <label class="switch"><span data-i18n="nav.combinations"></span><input class="switch-input" type="checkbox" role="switch" data-module="combinations"></label>
        </div>
        <div id="install-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.app"></h2>
          <div class="list-group">
            <button id="install" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.install"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.help"></h2>
        <div class="list-group">
          <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
          <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>

    <button id="fab" class="fab" type="button" data-i18n-attr="aria-label:wardrobe.add">+</button>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="wardrobe">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#hanger"/></svg>
        <span data-i18n="nav.wardrobe"></span>
      </button>
      <button class="nav-item" type="button" data-view="combinations">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#palette"/></svg>
        <span data-i18n="nav.combinations"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="garment-sheet" class="sheet-layer" hidden>
      <div id="garment-veil" class="sheet-veil"></div>
      <form id="garment-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="garment-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="garment-sheet-title" class="sheet-title main"></h2><button id="garment-close" class="button tonal" type="button" data-i18n="action.close"></button></header>
        <div class="sheet-body">
          <label class="field"><input id="garment-name" class="input field-input" type="text" maxlength="60" required data-i18n-attr="placeholder:wardrobe.name"><span class="field-label" data-i18n="wardrobe.name"></span></label>
          <label class="field"><input id="garment-brand" class="input field-input" type="text" maxlength="40" list="garment-brands" data-i18n-attr="placeholder:wardrobe.brand"><span class="field-label" data-i18n="wardrobe.brand"></span></label>
          <datalist id="garment-brands"></datalist>
          <select id="garment-slot" class="select" data-i18n-attr="aria-label:wardrobe.slot"></select>
          <select id="garment-season" class="select" data-i18n-attr="aria-label:wardrobe.season"></select>
          <div class="color-pick">
            <input id="garment-color-input" class="color-pick-input" type="color" data-i18n-attr="aria-label:wardrobe.color">
            <span id="garment-color-name" class="color-pick-name"></span>
          </div>
          <div id="garment-swatches" class="swatch-grid"></div>
          <label class="field"><input id="garment-link" class="input field-input" type="url" inputmode="url" data-i18n-attr="placeholder:wardrobe.link"><span class="field-label" data-i18n="wardrobe.link"></span></label>
          <button id="garment-load" class="button outline wide" type="button" data-i18n="wardrobe.loadImages" disabled></button>
          <div id="garment-images" class="image-grid" hidden></div>
          <div class="input-row">
            <input id="garment-image-url" class="input" type="url" inputmode="url" data-i18n-attr="placeholder:wardrobe.imageUrl,aria-label:wardrobe.imageUrl">
            <button id="garment-image-add" class="button outline" type="button" data-i18n="action.add"></button>
          </div>
          <h3 class="sheet-title part" data-i18n="wardrobe.sizing"></h3>
          <label class="field"><input id="garment-size" class="input field-input" type="text" maxlength="20" data-i18n-attr="placeholder:wardrobe.size"><span class="field-label" data-i18n="wardrobe.size"></span></label>
          <div id="garment-fit" class="cluster" role="group" data-i18n-attr="aria-label:wardrobe.fit"></div>
          <div id="garment-measures" class="measure-lines"></div>
          <button id="garment-measure-add" class="button outline wide" type="button" data-i18n="wardrobe.addMeasure"></button>
          <datalist id="garment-measure-names"></datalist>
          <datalist id="garment-units"></datalist>
        </div>
        <footer class="sheet-foot"><button class="button primary wide" type="submit" data-i18n="action.save"></button></footer>
      </form>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <img class="onboarding-logo" src="./icons/logo.png" alt="">
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="welcome" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M90 50h60M90 74h44M90 98h52"/>
            <circle class="art-solid" cx="170" cy="130" r="18"/>
            <path class="art-on-solid" d="M170 122v16M162 130h16"/>
          </svg>
          <svg data-page="offline" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M96 70a34 34 0 0 1 48 0M106 82a20 20 0 0 1 28 0"/>
            <circle class="art-accent" cx="120" cy="96" r="4"/>
            <path d="M92 52l56 64"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title" class="onboarding-title"></h2>
          <p id="onboarding-text" class="onboarding-text"></p>
        </div>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" class="button outline quiet" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="button primary" type="button"></button>
      </div>
    </div>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#ds/sheet": "./vendor/design-system/sheet.js",
          "#config": "./src/config.js",
          "#wada": "./src/wada.js",
          "#palette": "./src/palette.js",
          "#garments": "./src/garments.js",
          "#measures": "./src/measures.js",
          "#links": "./src/links.js",
          "#outfits": "./src/outfits.js",
          "#install": "./src/install.js",
          "#sections": "./src/sections.js",
          "#modules": "./src/modules.js",
          "#storage": "./src/storage.js",
          "#version": "./src/version.js",
          "#whatsnew": "./src/whatsnew.js",
          "#i18n": "./src/i18n.js",
          "#locales/en": "./src/locales/en.js",
          "#locales/es": "./src/locales/es.js",
          "#ui/context": "./src/ui/context.js",
          "#ui/controls": "./src/ui/controls.js",
          "#ui/install": "./src/ui/install.js",
          "#ui/motion": "./src/ui/motion.js",
          "#ui/nav": "./src/ui/nav.js",
          "#ui/outfit": "./src/ui/outfit.js",
          "#ui/combinations": "./src/ui/combinations.js",
          "#ui/wardrobe": "./src/ui/wardrobe.js",
          "#ui/settings": "./src/ui/settings.js",
          "#swipe": "./src/swipe.js",
          "#particles": "./src/particles.js",
          "#onboarding": "./src/onboarding.js",
          "#ui/dust": "./src/ui/dust.js",
          "#ui/onboarding": "./src/ui/onboarding.js",
          "#ui/whatsnew": "./src/ui/whatsnew.js",
          "#ui/update": "./src/ui/update.js"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
